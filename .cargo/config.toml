[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor --flash-size 8mb --partition-table firmware/partitions.csv"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
ESP_IDF_SYS_ROOT_CRATE = "badge-apple"
ESP_IDF_VERSION = "v5.4.4"
ESP_IDF_SDKCONFIG_DEFAULTS = { value = "firmware/sdkconfig.defaults", relative = true }
